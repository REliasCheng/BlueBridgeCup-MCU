name: BlueBridge portable host tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build and run portable policy tests
        shell: bash
        run: |
          set -euo pipefail
          dir=practice/peripheral-driver-corrections
          "$CC" -std=c11 -Wall -Wextra -Werror -pedantic -I "$dir" \
            "$dir/peripheral_policy.c" "$dir/tests/test_peripheral_policy.c" -o /tmp/bluebridge-policy
          /tmp/bluebridge-policy
          "$CC" -std=c11 -Wall -Wextra -Werror -pedantic -DHOST_TEST \
            -I "$dir/tests/stubs" -I "$dir" \
            "$dir/key_task_safe.c" "$dir/peripheral_policy.c" \
            "$dir/tests/test_key_task_safe.c" -o /tmp/bluebridge-key-task
          /tmp/bluebridge-key-task
          "$CC" -std=c11 -Wall -Wextra -Werror -pedantic -I "$dir" \
            "$dir/peripheral_policy.c" "$dir/tests/test_pcf8591_transaction.c" -o /tmp/bluebridge-pcf
          /tmp/bluebridge-pcf
          "$CC" -std=c11 -Wall -Wextra -Werror -pedantic -DHOST_TEST \
            -I "$dir/tests/stubs" -I "$dir" \
            "$dir/uart_safe.c" "$dir/peripheral_policy.c" "$dir/tests/test_uart_safe.c" \
            -o /tmp/bluebridge-uart
          /tmp/bluebridge-uart
          "$CC" -std=c11 -Wall -Wextra -Werror -pedantic -DHOST_TEST \
            -I "$dir/tests/stubs" -I "$dir" -fsyntax-only \
            "$dir/iic_safe.c" "$dir/ds18b20_safe.c"
          "$CC" -std=c11 -Wall -Wextra -Werror -pedantic -DHOST_TEST \
            -I "$dir/tests/stubs" -I "$dir" \
            "$dir/peripheral_policy.c" "$dir/tests/test_ds18b20_timing.c" \
            -o /tmp/bluebridge-ds18b20
          /tmp/bluebridge-ds18b20
          "$CC" -std=c11 -Wall -Wextra -Werror -pedantic -DHOST_TEST \
            -I "$dir/tests/stubs" -I "$dir" \
            "$dir/rtc_startup.c" "$dir/peripheral_policy.c" "$dir/tests/test_rtc_startup.c" \
            -o /tmp/bluebridge-rtc
          /tmp/bluebridge-rtc
        env:
          CC: ${{ matrix.compiler }}

  sdcc-target:
    name: SDCC MCS-51 compile/link/HEX and C52 software state
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install distribution SDCC and uCsim
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sdcc sdcc-ucsim
          sdcc -v
      - name: Build twice, inspect linked software state and compare HEX
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_sdcc_target.py --output "$RUNNER_TEMP/bluebridge-first"
          python3 scripts/build_sdcc_target.py --output "$RUNNER_TEMP/bluebridge-second"
          cmp "$RUNNER_TEMP/bluebridge-first/bluebridge_iap15_policy.hex" \
              "$RUNNER_TEMP/bluebridge-second/bluebridge_iap15_policy.hex"
          python3 scripts/run_sdcc_simulator.py --build "$RUNNER_TEMP/bluebridge-first"
          sha256sum "$RUNNER_TEMP/bluebridge-first/bluebridge_iap15_policy.hex"
      - name: Preserve target verification logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bluebridge-sdcc-verification
          path: |
            ${{ runner.temp }}/bluebridge-first/build.log
            ${{ runner.temp }}/bluebridge-first/build-report.json
            ${{ runner.temp }}/bluebridge-first/simulator.log
            ${{ runner.temp }}/bluebridge-first/simulator-report.json
            ${{ runner.temp }}/bluebridge-second/build.log
            ${{ runner.temp }}/bluebridge-second/build-report.json
          if-no-files-found: error
