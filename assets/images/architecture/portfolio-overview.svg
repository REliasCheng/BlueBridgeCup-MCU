<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">CT107D board-control path</title>
  <desc id="desc">Input events pass through host-tested policy logic and shared CT107D board resources.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8b949e"/></marker>
    <style>
      .bg{fill:#0d1117}.grid{stroke:#30363d;stroke-width:1;opacity:.35}.box{stroke-width:2}.input{fill:#21262d;stroke:#8b949e}.core{fill:#0d419d;stroke:#58a6ff}.hardware{fill:#1f6f3d;stroke:#3fb950}.output{fill:#f0f6fc;stroke:#c9d1d9}.title{font:700 27px system-ui,sans-serif;fill:#f0f6fc}.subtitle{font:16px system-ui,sans-serif;fill:#8b949e}.label{font:700 17px system-ui,sans-serif;fill:#f0f6fc;text-anchor:middle}.detail{font:13px system-ui,sans-serif;fill:#c9d1d9;text-anchor:middle}.dark{fill:#0d1117}.arrow{stroke:#8b949e;stroke-width:3;marker-end:url(#arrow)}.footer{font:14px system-ui,sans-serif;fill:#8b949e;text-anchor:middle}
    </style>
  </defs>
  <rect class="bg" width="1200" height="360" rx="22"/>
  <path class="grid" d="M0 90H1200M0 270H1200M240 0V360M480 0V360M720 0V360M960 0V360"/>
  <text class="title" x="50" y="54">CT107D board-control path</text>
  <text class="subtitle" x="50" y="84">Policy logic · shared bus · peripheral coordination</text>
  <rect class="box input" x="50" y="140" width="180" height="92" rx="14"/>
  <text class="label" x="140" y="177">Input / Event</text>
  <text class="detail" x="140" y="205">keys / timing</text>
  <rect class="box core" x="280" y="140" width="180" height="92" rx="14"/>
  <text class="label" x="370" y="177">Policy</text>
  <text class="detail" x="370" y="205">host-tested</text>
  <rect class="box core" x="510" y="140" width="180" height="92" rx="14"/>
  <text class="label" x="600" y="177">Shared Bus</text>
  <text class="detail" x="600" y="205">P0 + latches</text>
  <rect class="box hardware" x="740" y="140" width="180" height="92" rx="14"/>
  <text class="label" x="830" y="177">CT107D</text>
  <text class="detail" x="830" y="205">peripherals</text>
  <rect class="box output" x="970" y="140" width="180" height="92" rx="14"/>
  <text class="label dark" x="1060" y="177">State</text>
  <text class="detail dark" x="1060" y="205">observable</text>
  <path class="arrow" d="M230 186H270"/><path class="arrow" d="M460 186H500"/><path class="arrow" d="M690 186H730"/><path class="arrow" d="M920 186H960"/>
  <text class="footer" x="600" y="305">Host-tested control policy; Keil target build and board validation are not claimed.</text>
</svg>

