<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">CT107D shared-resource control</title>
  <desc id="desc">Key and timing events enter host-tested policies before reaching the shared P0 bus, latch routing, and board peripherals.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8b949e"/></marker><style>.bg{fill:#0d1117}.grid{stroke:#30363d;opacity:.28}.box{stroke-width:2}.input{fill:#21262d;stroke:#8b949e}.core{fill:#0d419d;stroke:#58a6ff}.hardware{fill:#1f6f3d;stroke:#3fb950}.output{fill:#f0f6fc;stroke:#c9d1d9}.title{font:700 28px system-ui,sans-serif;fill:#f0f6fc}.sub{font:16px system-ui,sans-serif;fill:#8b949e}.label{font:700 17px system-ui,sans-serif;fill:#f0f6fc;text-anchor:middle}.detail{font:13px system-ui,sans-serif;fill:#c9d1d9;text-anchor:middle}.dark{fill:#0d1117}.arrow{fill:none;stroke:#8b949e;stroke-width:3;marker-end:url(#arrow)}</style></defs>
  <rect class="bg" width="1200" height="460" rx="22"/><path class="grid" d="M0 110H1200M0 360H1200M300 0V460M600 0V460M900 0V460"/>
  <text class="title" x="50" y="54">CT107D Shared-Resource Control</text><text class="sub" x="50" y="84">Timing policy · P0 data path · latch selection · peripheral coordination</text>
  <rect class="box input" x="50" y="145" width="190" height="86" rx="14"/><text class="label" x="145" y="180">Keys / UART</text><text class="detail" x="145" y="207">input events</text>
  <rect class="box input" x="50" y="290" width="190" height="86" rx="14"/><text class="label" x="145" y="325">Timer2 Tick</text><text class="detail" x="145" y="352">periodic timing</text>
  <rect class="box core" x="330" y="215" width="210" height="94" rx="14"/><text class="label" x="435" y="252">Policy Core</text><text class="detail" x="435" y="280">host-tested rules</text>
  <rect class="box core" x="630" y="215" width="210" height="94" rx="14"/><text class="label" x="735" y="252">Shared P0 Bus</text><text class="detail" x="735" y="280">data + selection</text>
  <rect class="box hardware" x="930" y="140" width="210" height="94" rx="14"/><text class="label" x="1035" y="177">74HC138 / 573</text><text class="detail" x="1035" y="205">latch routing</text>
  <rect class="box output" x="930" y="290" width="210" height="94" rx="14"/><text class="label dark" x="1035" y="327">Board Peripherals</text><text class="detail dark" x="1035" y="355">display · RTC · sensor</text>
  <path class="arrow" d="M240 188L330 238M240 333L330 286M540 262H630M840 246L930 187M840 278L930 337"/>
</svg>
